[package]
name = "kimono"
version = "1.0.0"
edition = "2021"
description = "AI Developer Lifecycle wrapper for codebases — single or multi-repo — with an installable Claude skill catalog"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
which = "7"
dirs = "6"

[dev-dependencies]
tempfile = "3"
