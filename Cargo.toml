[package]
name = "kimono"
version = "0.1.0"
edition = "2021"
description = "Multi-repo aggregator for AI-assisted development with Claude Code"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
anyhow = "1"
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
which = "7"
dirs = "6"

[dev-dependencies]
tempfile = "3"
